[project]
name = "maps-mcp"
version = "0.1.0"
description = "MCP server + CLI for Google Maps Platform (Directions + Places)"
requires-python = ">=3.11"
dependencies = [
    "mcp[cli]>=1.2.0",
]

[project.scripts]
maps-mcp = "maps_mcp.server:main"
maps-cli = "maps_mcp.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["maps_mcp"]
